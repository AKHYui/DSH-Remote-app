include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat the things that bite in production as errors, not hints.
    unawaited_futures: error
    avoid_print: error
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
