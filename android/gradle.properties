org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is off because it does not survive on this
# machine: `image_picker_android:compileReleaseKotlin` fails with
#
#   Could not close incremental caches in .../compileReleaseKotlin/cacheable/caches-jvm/...
#   Suppressed: IllegalStateException: Storage for [.../class-fq-name-to-source.tab] is already registered
#
# That is the Kotlin daemon re-registering caches it already holds, and it
# survived a `flutter clean`, deleting the module's build directory, and killing
# every Gradle/Kotlin daemon. Turning the incremental caches off is the documented
# workaround; the cost is a slower repeat build of the plugins, which this project
# builds rarely.
kotlin.incremental=false
